# Code Brothers — LITE profile (spec Section 11, Step 9)
# For ~4GB RAM machines: core stack + FREE CLOUD AI (Gemini / Groq /
# OpenRouter free tiers) or an Ollama running on the host. No local models
# are bundled — use docker-compose.full.yml for the fully offline stack.
#
# Hardening (spec Section 8G): non-root images, read_only filesystems,
# cap_drop: [ALL], database/Redis bound to localhost only and reachable
# from the app only over the internal network.
#
# Run from the repository root:
#   docker compose -f docker/docker-compose.lite.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codebrothers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codebrothers}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    user: "999:999"
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    networks: [internal_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codebrothers}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports: ["127.0.0.1:6379:6379"]
    user: "999:999"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-codebrothers}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-codebrothers}
      CB_MASTER_KEY: ${CB_MASTER_KEY:?set CB_MASTER_KEY in .env}
      # Lite profile: AI comes from free cloud tiers and/or host Ollama.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [public_net, internal_net]
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-codebrothers}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-codebrothers}
      CB_MASTER_KEY: ${CB_MASTER_KEY:?set CB_MASTER_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [internal_net]
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    networks: [public_net]

networks:
  public_net:
  internal_net:
    internal: true

volumes:
  pgdata:

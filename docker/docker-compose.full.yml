# Code Brothers — FULL profile (spec Section 11, Step 9)
# Fully offline AI: local Ollama models + the Python AI media worker
# (Faster-Whisper / PaddleOCR / Piper / FFmpeg). Needs a bigger machine
# than the lite profile (models run on CPU/GPU locally).
#
# Hardening (spec Section 8G): non-root app images, read_only filesystems,
# cap_drop: [ALL], every data/AI service bound to localhost only and
# reachable from the app only over the internal network. Ollama (11434)
# is NEVER published on a public interface.
#
# Run from the repository root:
#   docker compose -f docker/docker-compose.full.yml up -d
#   docker compose -f docker/docker-compose.full.yml exec ollama ollama pull qwen2.5:7b
#   docker compose -f docker/docker-compose.full.yml exec ollama ollama pull bge-m3
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codebrothers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codebrothers}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    user: "999:999"
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    networks: [internal_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codebrothers}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports: ["127.0.0.1:6379:6379"]
    user: "999:999"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
  ai-media-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai-media-worker
    environment:
      CB_MEDIA_DIR: /data/media
      CB_MAX_UPLOAD_MB: ${CB_MAX_UPLOAD_MB:-25}
    volumes: [media:/data/media]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-codebrothers}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-codebrothers}
      CB_MASTER_KEY: ${CB_MASTER_KEY:?set CB_MASTER_KEY in .env}
      OLLAMA_HOST: http://ollama:11434
      AI_MEDIA_WORKER_URL: http://ai-media-worker:8000
      # Free cloud AI still works as a fallback in the full profile.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      ai-media-worker:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [public_net, internal_net]
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    networks: [public_net]

networks:
  public_net:
  internal_net:
    internal: true

volumes:
  pgdata:
  ollama:
  media:

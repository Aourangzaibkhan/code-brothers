# Code Brothers dashboard — production nginx server block.
#
# Used by docker/Dockerfile.web (copied to /etc/nginx/conf.d/default.conf,
# replacing the image's default server). The SPA (apps/web) calls the API
# with relative /api/* and /hooks/* URLs, so this server proxies both
# paths to the `api` service on the compose network — without this proxy
# the production dashboard cannot reach the API at all (the vite dev
# proxy that does this job only exists in development).
#
# The `api` hostname is resolved by Docker's embedded DNS to the api
# service (see docker/docker-compose.lite.yml — web and api share the
# public_net network). It does NOT resolve outside Docker; for a local
# check, replace `api` with 127.0.0.1 and point the API at port 3000.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: static files, with client-side routes falling back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed vite assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + webhook gateway, proxied to the api service.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API can take a while on workflow runs; don't cut it off early.
        proxy_read_timeout 120s;
    }

    location /hooks/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
